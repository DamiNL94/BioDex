document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

und:#1F4D34;padding:52px 56px 46px\">\n<p style=\"margin:0 0 14px;font:700 11px/1 'Public Sans';letter-spacing:.18em;text-transform:uppercase;color:#C4A15E\">Revisión de diseño · dirección 2 · agosto 2026<\u002Fp>\n<h1 style=\"margin:0 0 18px;font:700 56px/1.02 'Zilla Slab',serif;letter-spacing:-.01em;color:#FFFFFF;max-width:17ch\">Guía de parques, con uniforme de ranger<\u002Fh1>\n<p style=\"margin:0;max-width:62ch;font-size:16.5px;line-height:1.65;color:#CFDCD1;text-wrap:pretty\">Fuera la estética de laboratorio. Esta dirección toma prestado el lenguaje de la señalética de parques nacionales: verde bosque y marrón de cartel tallado, tipografía slab de rótulo, superficies blancas con filetes de color, pastillas de estado y parches de mérito. Los datos científicos siguen ahí, pero presentados como una guía de excursión, no como una hoja de cálculo.<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"padding:34px 56px 0;max-width:1180px\">\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:1px;background:#E3E3DF;border:1px solid #E3E3DF;border-radius:3px;overflow:hidden\">\n<div style=\"background:#FFFFFF;padding:22px\"><p style=\"margin:0 0 9px;font:700 10px/1 'Public Sans';letter-spacing:.16em;color:#C4762A\">QUÉ CAMBIA 01<\u002Fp><p style=\"margin:0 0 7px;font:600 18px/1.25 'Zilla Slab',serif\">Cabecera de cartel<\u002Fp><p style=\"margin:0;font-size:13.5px;line-height:1.6;color:#6A6A61\">Verde bosque con filete dorado, como los rótulos de entrada de parque. Da identidad instantánea sin ocupar media pantalla.<\u002Fp><\u002Fdiv>\n<div style=\"background:#FFFFFF;padding:22px\"><p style=\"margin:0 0 9px;font:700 10px/1 'Public Sans';letter-spacing:.16em;color:#C4762A\">QUÉ CAMBIA 02<\u002Fp><p style=\"margin:0 0 7px;font:600 18px/1.25 'Zilla Slab',serif\">Zilla Slab + Public Sans<\u002Fp><p style=\"margin:0;font-size:13.5px;line-height:1.6;color:#6A6A61\">Slab de señal para titulares, Public Sans (la misma familia del sistema de diseño público de EEUU) para todo lo demás: legible al sol y con acento institucional.<\u002Fp><\u002Fdiv>\n<div style=\"background:#FFFFFF;padding:22px\"><p style=\"margin:0 0 9px;font:700 10px/1 'Public Sans';letter-spacing:.16em;color:#C4762A\">QUÉ CAMBIA 03<\u002Fp><p style=\"margin:0 0 7px;font:600 18px/1.25 'Zilla Slab',serif\">Alertas de guarda<\u002Fp><p style=\"margin:0;font-size:13.5px;line-height:1.6;color:#6A6A61\">Bandas de aviso en marrón y ámbar para condiciones, cierres e invasoras. Es lo que la app ya tiene (invasoras, revisiones) con voz de personal del parque.<\u002Fp><\u002Fdiv>\n<div style=\"background:#FFFFFF;padding:22px\"><p style=\"margin:0 0 9px;font:700 10px/1 'Public Sans';letter-spacing:.16em;color:#C4762A\">QUÉ CAMBIA 04<\u002Fp><p style=\"margin:0 0 7px;font:600 18px/1.25 'Zilla Slab',serif\">Parches, no barritas<\u002Fp><p style=\"margin:0;font-size:13.5px;line-height:1.6;color:#6A6A61\">El progreso se cuenta con parches de tela cosidos al cuaderno. Coleccionable de verdad, pero con estética adulta de recuerdo de viaje.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"padding:12px 56px 48px;max-width:1180px\">\n<h2 style=\"margin:0 0 6px;font:600 30px/1.15 'Zilla Slab',serif\">1 · La entrada<\u002Fh2>\n<p style=\"margin:0 0 30px;max-width:62ch;font-size:14.5px;line-height:1.65;color:#6A6A61\">La portada es ahora un cartel de bienvenida: foto del parque, banda verde con el nombre y las condiciones de hoy. Igual que llegar a la caseta de entrada.<\u002Fp>\n\n<div style=\"display:flex;flex-wrap:wrap;gap:38px;align-items:flex-start\">\n\n<div style=\"display:flex;flex-direction:column;gap:12px;width:408px\">\n<div style=\"width:390px;height:844px;border-radius:44px;background:#141310;padding:9px;box-shadow:0 24px 60px rgba(35,32,26,.24)\">\n<div style=\"position:relative;width:100%;height:100%;border-radius:36px;overflow:hidden;background:#FFFFFF;display:flex;flex-direction:column\">\n<div style=\"position:absolute;ins idth=\"1.8\" stroke-linecap=\"round\"><path d=\"M3 16c2-3 4-3 6 0s4 3 6 0 4-3 6 0\"><\u002Fpath><path d=\"M3 10c2-3 4-3 6 0s4 3 6 0 4-3 6 0\"><\u002Fpath><\u002Fsvg><span style=\"font:700 7.5px/1 'Public Sans';letter-spacing:.08em\">LITORAL<\u002Fspan><\u002Fspan>\n<span style=\"width:74px;height:74px;border-radius:999px;background:#F1F1EE;border:3px dashed #D4D4CE;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#A2A29A\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\"><rect x=\"5\" y=\"11\" width=\"14\" height=\"9\" rx=\"2\"><\u002Frect><path d=\"M8 11V8a4 4 0 0 1 8 0v3\"><\u002Fpath><\u002Fsvg><span style=\"font:700 7.5px/1 'Public Sans';letter-spacing:.08em\">3 MÁS<\u002Fspan><\u002Fspan>\n<\u002Fdiv>\n<div style=\"display:flex;gap:12px;align-items:flex-start;padding:15px;border-left:4px solid #C4A15E;background:#FBF1DF;margin-bottom:16px\">\n<span style=\"width:40px;height:40px;flex:none;border-radius:999px;background:#96601F;display:flex;align-items:center;justify-content:center\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#FBF1DF\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"9\" r=\"5.6\"><\u002Fcircle><path d=\"M8.6 13.6 7 22l5-2.7L17 22l-1.6-8.4\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n<span><strong style=\"display:block;font:700 14.5px/1.3 'Public Sans';margin-bottom:4px\">¡Más aguileño que un pijo lobo!<\u002Fstrong><span style=\"display:block;font-size:12.5px;line-height:1.5;color:#6A6A61\">Completa los 21 hábitats y los 16 rincones. Vas por el 14 %.<\u002Fspan><\u002Fspan>\n<\u002Fdiv>\n<p style=\"margin:0 0 10px;font:700 10.5px/1 'Public Sans';letter-spacing:.16em;color:#7C7C73\">HÁBITATS<\u002Fp>\n<div style=\"display:flex;flex-direction:column;gap:7px\">\n<div style=\"display:flex;align-items:center;gap:11px;padding:11px 13px;border:1px solid #E3E3DF;border-left:4px solid #C4762A;background:#FAFAF8\"><span style=\"flex:1;font:600 13px/1.2 'Public Sans'\">Azufaifar de Ziziphus<\u002Fspan><span style=\"font:700 11px/1 'Public Sans';color:#1F4D34\">3/5<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:11px;padding:11px 13px;border:1px solid #E3E3DF;border-left:4px solid #2E6D8E;background:#FAFAF8\"><span style=\"flex:1;font:600 13px/1.2 'Public Sans';color:#45453D\">Acantilados con Limonium<\u002Fspan><span style=\"font:700 11px/1 'Public Sans';color:#7C7C73\">1/6<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:11px;padding:11px 13px;border:1px solid #E3E3DF;border-left:4px solid #7A8B4F;background:#FAFAF8\"><span style=\"flex:1;font:600 13px/1.2 'Public Sans';color:#45453D\">Estepas salinas<\u002Fspan><span style=\"font:700 11px/1 'Public Sans';color:#7C7C73\">0/4<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<nav style=\"display:flex;gap:2px;padding:7px 10px calc(13px + env(safe-area-inset-bottom));border-top:1px solid #E3E3DF;background:#FFFFFF\" aria-label=\"Secciones\">\n<button type=\"button\" sc-camel-on-click=\"{{ goMapa }}\" style=\"{{ tabMapaStyle }}\"><svg width=\"21\" height=\"21\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linejoin=\"round\"><path d=\"M9 4 3 6.4v14L9 18l6 2.6 6-2.6v-14L15 6.4 9 4Z\"><\u002Fpath><path d=\"M9 4v14M15 6.4v14.2\"><\u002Fpath><\u002Fsvg>MAPA<\u002Fbutton>\n<button type=\"button\" sc-camel-on-click=\"{{ goCatalogo }}\" style=\"{{ tabCatalogoStyle }}\"><svg width=\"21\" height=\"21\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linejoin=\"round\"><path d=\"M4 4h5a3 3 0 0 1 3 3v13a2.6 2.6 0 0 0-2.6-2H4V4Z\"><\u002Fpath><path d=\"M20 4h-5a3 3 0 0 0-3 3v13a2.6 2.6 0 0 1 2.6-2H20V4Z\"><\u002Fpath><\u002Fsvg>GUÍA<\u002Fbutton>\n<button type=\"button\" sc-camel-on-click=\"{{ toggleCerca }}\" style=\"{{ tabCercaStyle }}\"><svg width=\"21\" height=\"21\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\"><circle cx=\"12\" cy=\"12\" r=\"3\"><\u002Fcircle><circle cx=\"12\" cy=\"12\" r=\"8.2\" opacity=\".5\"><\u002Fcircle><path d=\"M12 1.6v2.6M12 19.8v2.6M22.4 12h-2.6M4.2 12H1.6\"><\u002Fpath><\u002Fsvg>CERCA<\u002Fbutton>\n<button type=\"button\" sc-camel-on-click=\"{{ goProgreso }}\" style=\"{{ tabProgresoStyle }}\"><svg width=\"21\" height=\"21\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"9\" r=\"5.6\"><\u002Fcircle><path d=\"M8.6 13.6 7 22l5-2.7L17 22l-1.6-8.4\"><\u002Fpath><\u002Fsvg>CUADERNO<\u002Fbutton>\n<\u002Fnav>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"width:330px;display:flex;flex-direction:column;gap:22px\">\n<div><p style=\"margin:0 0 6px;font:700 10.5px/1 'Public Sans';letter-spacing:.16em;color:#C4762A\">CAMBIO 01<\u002Fp><p style=\"margin:0 0 5px;font:600 17px/1.3 'Zilla Slab',serif\">Cartel verde en cabecera<\u002Fp><p style=\"margin:0;font-size:13.5px;line-height:1.6;color:#6A6A61\">El chip del parque es una placa verde con filete dorado, no una pastilla neutra. Se reconoce a un metro de distancia y bajo el sol.<\u002Fp><\u002Fdiv>\n<div><p style=\"margin:0 0 6px;font:700 10.5px/1 'Public Sans';letter-spacing:.16em;color:#C4762A\">CAMBIO 02<\u002Fp><p style=\"margin:0 0 5px;font:600 17px/1.3 'Zilla Slab',serif\">Filete de color en cada fila<\u002Fp><p style=\"margin:0;font-size:13.5px;line-height:1.6;color:#6A6A61\">Cada hábitat lleva su color en una barra lateral gruesa, como las señales de sendero (GR blanco-rojo, PR blanco-amarillo). Sustituye a los puntitos de 10 px.<\u002Fp><\u002Fdiv>\n<div><p style=\"margin:0 0 6px;font:700 10.5px/1 'Public Sans';letter-spacing:.16em;color:#C4762A\">CAMBIO 03<\u002Fp><p style=\"margin:0 0 5px;font:600 17px/1.3 'Zilla Slab',serif\">Esquinas rectas<\u002Fp><p style=\"margin:0;font-size:13.5px;line-height:1.6;color:#6A6A61\">Radios de 2-4 px en vez de 12-16 px. Aporta el carácter impreso, de cartel y folleto, que pedía la referencia.<\u002Fp><\u002Fdiv>\n<div><p style=\"margin:0 0 6px;font:700 10.5px/1 'Public Sans';letter-spacing:.16em;color:#C4762A\">CAMBIO 04<\u002Fp><p style=\"margin:0 0 5px;font:600 17px/1.3 'Zilla Slab',serif\">Parches en vez de medallas<\u002Fp><p style=\"margin:0;font-size:13.5px;line-height:1.6;color:#6A6A61\">En el Cuaderno, cada hábitat completado cose un parche redondo con borde dorado. Los pendientes se ven candados, para dar meta. Míralo en la pestaña <em>Cuaderno<\u002Fem>.<\u002Fp><\u002Fdiv>\n<div><p style=\"margin:0 0 6px;font:700 10.5px/1 'Public Sans';letter-spacing:.16em;color:#C4762A\">CAMBIO 05<\u002Fp><p style=\"margin:0 0 5px;font:600 17px/1.3 'Zilla Slab',serif\">Etiquetas en versalitas<\u002Fp><p style=\"margin:0;font-size:13.5px;line-height:1.6;color:#6A6A61\">Códigos, estados y metadatos en mayúsculas espaciadas: el mismo recurso de la señalética de parques, y resuelve el problema de que los códigos 5220* se leían como texto normal.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"padding:12px 56px 48px;max-width:1180px\">\n<h2 style=\"margin:0 0 6px;font:600 30px/1.15 'Zilla Slab',serif\">3 · Selector de parque, Invasoras y modo oscuro<\u002Fh2>\n<p style=\"margin:0 0 30px;max-width:62ch;font-size:14.5px;line-height:1.65;color:#6A6A61\">Las tres piezas que faltaban, con el mismo uniforme: el selector deja de ser un formulario y pasa a ser una lista de destinos; Invasoras adopta la voz de un aviso oficial; y el modo oscuro se resuelve como un cartel retroiluminado, no como un blanco invertido.<\u002Fp>\n\n<div style=\"display:flex;flex-wrap:wrap;gap:38px;align-items:flex-start\">\n\n<div style=\"display:flex;flex-direction:column;gap:12px;width:408px\">\n<div style=\ utton\" style=\"min-height:46px;border:0;background:transparent;color:#6A6A61;font:700 12.5px/1 'Public Sans';letter-spacing:.08em;cursor:pointer\">CERRAR SESIÓN<\u002Fbutton>\n<button type=\"button\" style=\"min-height:40px;border:0;background:transparent;color:#A0451F;font:600 12px/1 'Public Sans';cursor:pointer\">Borrar mi cuenta<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<p style=\"margin:0;font:400 13px/1.55 'Public Sans';color:#6A6A61;max-width:390px\"><strong style=\"font-weight:700;color:#1A1A17\">Perfil y ajustes.<\u002Fstrong> Los siete bloques del documento, ordenados por frecuencia de uso: progreso arriba, baja de cuenta al fondo. Los conmutadores de tema y tamaño son de tres estados, con marco marrón de sello, no pastillas.<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"display:flex;flex-direction:column;gap:12px;width:408px\">\n<div style=\"width:390px;height:844px;border-radius:44px;background:#141310;padding:9px;box-shadow:0 24px 60px rgba(26,26,23,.2)\">\n<div style=\"position:relative;width:100%;height:100%;border-radius:36px;overflow:hidden;background:#FFFFFF;display:flex;flex-direction:column\">\n<div style=\"display:flex;justify-content:space-between;align-items:center;padding:14px 24px 0;font:600 13px/1 'Public Sans'\"><span>9:41<\u002Fspan><span style=\"opacity:.45;font:600 11px/1 'Public Sans'\">●●●<\u002Fspan><\u002Fdiv>\n<div style=\"padding:14px 18px 0\"><button type=\"button\" style=\"border:0;background:transparent;padding:0;font:700 12.5px/1 'Public Sans';letter-spacing:.08em;color:#1F4D34;cursor:pointer\">← PERFIL<\u002Fbutton><\u002Fdiv>\n<div style=\"flex:1;min-height:0;overflow:auto;padding:12px 18px 20px\">\n<h2 style=\"margin:0 0 4px;font:700 27px/1.1 'Zilla Slab',serif\">Tu progreso estatal<\u002Fh2>\n<p style=\"margin:0 0 16px;font-size:13.5px;line-height:1.55;color:#6A6A61\">Todo lo descubierto en todos los parques. Un logro, una vez conseguido, no se pierde.<\u002Fp>\n\n<div style=\"position:relative;height:170p solid #E3E3DF;border-left:4px solid #4A3B2A;background:#FAFAF8\"><strong style=\"display:block;font:700 25px/1 'Zilla Slab',serif\">9<\u002Fstrong><span style=\"display:block;margin-top:5px;font:700 9.5px/1 'Public Sans';letter-spacing:.1em;color:#7C7C73\">DÍAS DE CAMPO<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display:flex;gap:11px;align-items:center;padding:13px;background:#4A3B2A;border-bottom:4px solid #C4A15E;margin-bottom:18px\">\n<svg width=\"22\" height=\"22\" style=\"flex:none\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#E8B45A\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 3.5 14.6 9l6 .9-4.3 4.2 1 6-5.3-2.8L6.7 20l1-6L3.4 9.9l6-.9L12 3.5Z\"><\u002Fpath><\u002Fsvg>\n<span><strong style=\"display:block;font:700 13px/1.3 'Public Sans';color:#F2E5CE;margin-bottom:3px\">Último logro · Ojo entrenado<\u002Fstrong><span style=\"display:block;font-size:12px;line-height:1.45;color:#D9CBAF\">25 especies distintas. Ya no hace falta que te digan dónde mirar.<\u002Fspan><\u002Fspan>\n<\u002Fdiv>\n\n<div style=\"display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px\"><p style=\"margin:0;font:700 10.5px/1 'Public Sans';letter-spacing:.16em;color:#7C7C73\">ESPECIES AVISTADAS<\u002Fp><span style=\"font:700 10.5px/1 'Public Sans';color:#1F4D34\">2 / 7<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;gap:9px;flex-wrap:wrap;margin-bottom:18px\">\n<span style=\"width:70px;display:flex;flex-direction:column;align-items:center;gap:5px\"><span style=\"width:64px;height:64px;border-radius:999px;background:#1F4D34;border:3px solid #C4A15E;display:flex;align-items:center;justify-content:center\"><svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#F2E5CE\" stroke-width=\"1.8\" stroke-linecap=\"round\"><circle cx=\"11\" cy=\"11\" r=\"6.6\"><\u002Fcircle><path d=\"m16 16 4.4 4.4\"><\u002Fpath><\u002Fsvg><\u002Fspan><span style=\"text-align:center;font:700 8.5px/1.25 'Public Sans';letter-spacing:.04em;color:#1A1A17\">PRIMER<br>AVISTAMIENTO<\u002Fspan><\u002Fspan>\n<span style=\"width:70px;display:flex;flex-direction:column;align-items:center;gap:5px\"><span style=\"width:64px;height:64px;border-radius:999px;background:#1F4D34;border:3px solid #C4A15E;display:flex;align-items:center;justify-content:center\"><svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#F2E5CE\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 21c6-2 9-6.4 9-12V4l-9 3-9-3v5c0 5.6 3 10 9 12Z\"><\u002Fpath><\u002Fsvg><\u002Fspan><span style=\"text-align:center;font:700 8.5px/1.25 'Public Sans';letter-spacing:.04em;color:#1A1A17\">CUADERNO<br>DE CAMPO<\u002Fspan><\u002Fspan>\n<span style=\"width:70px;display:flex;flex-direction:column;align-items:center;gap:5px\"><span style=\"width:64px;height:64px;border-radius:999px;background:#F1F1EE;border:3px dashed #D4D4CE;display:flex;align-items:center;justify-content:center;position:relative\"><svg width=\"21\" height=\"21\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#A2A29A\" stroke-width=\"1.8\" stroke-linecap=\"round\"><rect x=\"5\" y=\"11\" width=\"14\" height=\"9\" rx=\"2\"><\u002Frect><path d=\"M8 11V8a4 4 0 0 1 8 0v3\"><\u002Fpath><\u002Fsvg><\u002Fspan><span style=\"text-align:center;font:700 8.5px/1.25 'Public Sans';letter-spacing:.04em;color:#A2A29A\">OJO<br>ENTRENADO<\u002Fspan><\u002Fspan>\n<span style=\"width:70px;display:flex;flex-direction:column;align-items:center;gap:5px\"><span style=\"width:64px;height:64px;border-radius:999px;background:#F1F1EE;border:3px dashed #D4D4CE;display:flex;align-items:center;justify-content:center\"><span style=\"font:700 12px/1 'Public Sans';color:#A2A29A\">+4<\u002Fspan><\u002Fspan><span style=\"text-align:center;font:700 8.5px/1.25 'Public Sans';letter-spacing:.04em;color:#A2A29A\">POR<br>DESBLOQUEAR<\u002Fspan><\u002Fspan>\n<\u002Fdiv>\n\n<div style=\"display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px\"><p style=\"margin:0;font:700 10.5px/1 'Public Sans';letter-spacing:.16em;color:#7C7C73\">TERRITORIO PISADO<\u002Fp><span style=\"font:700 10.5px/1 'Public Sans';color:#1F4D34\">1 / 6<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:7px;margin-bottom:18px\">\n<div style=\"display:flex;align-items:center;gap:11px;padding:11px 12px;border:1px solid #E3E3DF;border-left:4px solid #1F4D34;background:#FAFAF8\"><span style=\"flex:1\"><span style=\"display:block;font:600 13px/1.2 'Public Sans'\">Tu comunidad<\u002Fspan><span style=\"display:block;margin-top:3px;font:700 9.5px/1 'Public Sans';letter-spacing:.08em;color:#7C7C73\">COMÚN · CONSEGUIDO<\u002Fspan><\u002Fspan><svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#1F4D34\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m5 13 4.5 4.5L19 7\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:11px;padding:11px 12px;border:1px solid #E3E3DF;border-left:4px solid #2E6D8E;background:#FFFFFF\"><span style=\"flex:1\"><span style=\"display:block;font:600 13px/1.2 'Public Sans';color:#6A6A61\">Cambio de aires · 3 comunidades<\u002Fspan><span style=\"display:block;margin-top:5px;height:5px;background:#E7E7E3\"><span style=\"display:block;height:100%;width:33%;background:#2E6D8E\"><\u002Fspan><\u002Fspan><\u002Fspan><span style=\"font:700 10.5px/1 'Public Sans';color:#7C7C73\">1/3<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:11px;padding:11px 12px;border:1px solid #E3E3DF;border-left:4px solid #4A3B2A;background:#FFFFFF\"><span style=\"flex:1\"><span style=\"display:block;font:600 13px/1.2 'Public Sans';color:#6A6A61\">España entera · 17 comunidades<\u002Fspan><span style=\"display:block;margin-top:3px;font:700 9.5px/1 'Public Sans';letter-spacing:.08em;color:#96601F\">LEGENDARIO<\u002Fspan><\u002Fspan><span style=\"font:700 10.5px/1 'Public Sans';color:#7C7C73\">1/17<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<p style=\"margin:0;font:500 11.5px/1.55 'Public Sans';color:#A2A29A\">Solo cuenta lo marcado durante una visita verificada por GPS dentro del límite oficial del espacio.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<p style=\"margin:0;font:400 13px/1.55 'Public Sans';color:#6A6A61;max-width:390px\"><strong style=\"font-weight:700;color:#1A1A17\">Progreso estatal.<\u002Fstrong> El mapa de España pisado abre la pantalla —es la métrica que da sentido a las 10 categorías del catálogo—. Los logros conseguidos se ven como parche; los pendientes, como candado con su progreso, para que den meta.<\u002Fp>\n<\u002Fdiv>\n\n<\u002Fdiv>\n\n<div style=\"margin-top:40px;border:1px solid #E3E3DF;background:#FFFFFF\">\n<div style=\"padding:20px 22px 0\"><h3 style=\"margin:0 0 6px;font:600 22px/1.2 'Zilla Slab',serif\">Fotos e ilustraciones: qué va en cada hueco<\u002Fh3><p style=\"margin:0 0 18px;max-width:70ch;font-size:13.5px;line-height:1.6;color:#6A6A61\">De las 78 especies, la mayoría no tiene fotografía con licencia confirmada, y las 13 de florasilvestre.es están pendientes de permiso. En vez de un icono genérico para todo, cada tipo de contenido tiene su propio marcador, construido con las bandas y el color de su categoría, con la etiqueta de lo que falta. Legible, honesto y sustituible por la foto real sin tocar la maqueta.<\u002Fp><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:#E3E3DF;border-top:1px solid #E3E3DF\">\n<div style=\"background:#FFFFFF;padding:16px\"><div style=\"height:130px;margin-bottom:11px;overflow:hidden\"><svg width=\"100%\" height=\"100%\" sc-camel-view-box=\"0 0 200 130\" sc-camel-preserve-aspect-ratio=\"none\" role=\"img\" aria-label=\"Marcador de fauna\"><rect width=\"200\" height=\"130\" fill=\"#DCE6E9\"><\u002Frect><rect y=\"86\" width=\"200\" height=\"44\" fill=\"#C6D8DE\"><\u002Frect><circle cx=\"152\" cy=\"40\" r=\"19\" fill=\"#B3CBD3\"><\u002Fcircle><text x=\"14\" y=\"120\" fill=\"#5E7C87\" font-family=\"Public Sans, sans-serif\" font-size=\"9\" font-weight=\"700\" letter-spacing=\"1.6\">FAUNA · SIN FOTO<\u002Ftext><\u002Fsvg><\u002Fdiv><strong style=\"display:block;font:600 14px/1.2 'Public Sans';margin-bottom:4px\">Fauna<\u002Fstrong><p style=\"margin:0;font-size:12.5px;line-height:1.55;color:#6A6A61\">Bandas de cielo y agua en azul del sistema, con disco solar. Se distingue de un vistazo en la lista.<\u002Fp><\u002Fdiv>\n<div style=\"background:#FFFFFF;padding:16px\"><div style=\"height:130px;margin-bottom:11px;overflow:hidden\"><svg width=\"100%\" height=\"100%\" sc-camel-view-box=\"0 0 200 130\" sc-camel-preserve-aspect-ratio=\"none\" role=\"img\" aria-label=\"Marcador de flora\"><rect width=\"200\" height=\"130\" fill=\"#E3E7D6\"><\u002Frect><rect y=\"96\" width=\"200\" height=\"34\" fill=\"#CFD8BE\"><\u002Frect><path d=\"M100 96 C74 82 76 46 100 30 C124 46 126 82 100 96 Z\" fill=\"#C3CFAE\"><\u002Fpath><text x=\"14\" y=\"120\" fill=\"#6F7C5B\" font-family=\"Public Sans, sans-serif\" font-size=\"9\" font-weight=\"700\" letter-spacing=\"1.6\">FLORA · SIN FOTO<\u002Ftext><\u002Fsvg><\u002Fdiv><strong style=\"display:block;font:600 14px/1.2 'Public Sans';margin-bottom:4px\">Flora<\u002Fstrong><p style=\"margin:0;font-size:12.5px;line-height:1.55;color:#6A6A61\">Hoja geométrica sobre suelo verde-oliva. Mismo lenguaje, distinta familia cromática.<\u002Fp><\u002Fdiv>\n<div style=\"background:#FFFFFF;padding:16px\"><div style=\"height:130px;margin-bottom:11px;overflow:hidden\"><svg width=\"100%\" height=\"100%\" sc-camel-view-box=\"0 0 200 130\" sc-camel-preserve-aspect-ratio=\"none\" role=\"img\" aria-label=\"Marcador de hábitat\"><rect width=\"200\" height=\"130\" fill=\"#EFEFEC\"><\u002Frect><rect y=\"40\" width=\"200\" height=\"30\" fill=\"#E0E4D6\"><\u002Frect><rect y=\"70\" width=\"200\" height=\"30\" fill=\"#D2D9C4\"><\u002Frect><rect y=\"100\" width=\"200\" height=\"30\" fill=\"#C3CFAE\"><\u002Frect><text x=\"14\" y=\"26\" fill=\"#7C7C73\" font-family=\"Public Sans, sans-serif\" font-size=\"9\" font-weight=\"700\" letter-spacing=\"1.6\">HÁBITAT 5220*<\u002Ftext><\u002Fsvg><\u002Fdiv><strong style=\"display:block;font:600 14px/1.2 'Public Sans';margin-bottom:4px\">Hábitat<\u002Fstrong><p style=\"margin:0;font-size:12.5px;line-height:1.55;color:#6A6A61\">Estratos horizontales que sugieren el corte del terreno, teñidos con el color propio del hábitat.<\u002Fp><\u002Fdiv>\n<div style=\"background:#FFFFFF;padding:16px\"><div style=\"height:130px;margin-bottom:11px;overflow:hidden\"><svg width=\"100%\" height=\"100%\" sc-camel-view-box=\"0 0 200 130\" sc-camel-preserve-aspect-ratio=\"none\" role=\"img\" aria-label=\"Marcador de punto de interés\"><rect width=\"200\" height=\"130\" fill=\"#EFEBE2\"><\u002Frect><rect y=\"92\" width=\"200\" height=\"38\" fill=\"#E0D8C6\"><\u002Frect><rect x=\"86\" y=\"34\" width=\"28\" height=\"58\" fill=\"#CFC2A8\"><\u002Frect><text x=\"14\" y=\"120\" fill=\"#8A7C63\" font-family=\"Public Sans, sans-serif\" font-size=\"9\" font-weight=\"700\" letter-spacing=\"1.6\">PUNTO DE INTERÉS<\u002Ftext><\u002Fsvg><\u002Fdiv><strong style=\"display:block;font:600 14px/1.2 'Public Sans';margin-bottom:4px\">Punto de interés<\u002Fstrong><p style=\"margin:0;font-size:12.5px;line-height:1.55;color:#6A6A61\">Familia marrón de cartel: silueta de hito (torre, ermita, yacimiento) sobre horizonte.<\u002Fp><\u002Fdiv>\n<div style=\"background:#FFFFFF;padding:16px\"><div style=\"height:130px;margin-bottom:11px;overflow:hidden\"><svg width=\"100%\" height=\"100%\" sc-camel-view-box=\"0 0 200 130\" sc-camel-preserve-aspect-ratio=\"none\" role=\"img\" aria-label=\"Marcador de especie invasora\"><rect width=\"200\" height=\"130\" fill=\"#FBF1DF\"><\u002Frect><rect y=\"0\" width=\"200\" height=\"6\" fill=\"#C4762A\"><\u002Frect><path d=\"M100 40 L128 92 H72 Z\" fill=\"#EBD3A8\"><\u002Fpath><text x=\"14\" y=\"120\" fill=\"#96601F\" font-family=\"Public Sans, sans-serif\" font-size=\"9\" font-weight=\"700\" letter-spacing=\"1.6\">INVASORA · SIN FOTO<\u002Ftext><\u002Fsvg><\u002Fdiv><strong style=\"display:block;font:600 14px/1.2 'Public Sans';margin-bottom:4px\">Invasora<\u002Fstrong><p style=\"margin:0;font-size:12.5px;line-height:1.55;color:#6A6A61\">Ámbar de aviso con filete naranja arriba: incluso sin foto se lee como advertencia, no como ficha de colección.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"padding:16px 22px 20px;border-top:1px solid #E3E3DF\"><p style=\"margin:0;max-width:78ch;font-size:12.5px;line-height:1.6;color:#7C7C73\"><strong style=\"color:#1A1A17;font-weight:600\">Para las fotos reales:<\u002Fstrong> priorizar Wikimedia Commons (licencia clara y ya en uso para las invasoras) y cerrar por escrito el permiso de florasilvestre.es o sustituir esas 13. Formato recomendado: 4:3, 1280 px de ancho, WebP, con el crédito en el campo <code style=\"font:500 12px/1 'Public Sans';background:#F1F1EE;padding:1px 5px\">source<\u002Fcode> que la ficha ya pinta. Para el onboarding, una ilustración por paso en la misma paleta (verde/marrón/latón), no fotografía.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"padding:12px 56px 72px;max-width:1180px\">\n<h2 style=\"margin:0 0 6px;font:600 30px/1.15 'Zilla Slab',serif\">5 · El sistema<\u002Fh2>\n<p style=\"margin:0 0 28px;max-width:62ch;font-size:14.5px;line-height:1.65;color:#6A6A61\">Paleta de señalética de parque —verde bosque, marrón de cartel tallado, dorado latón y ámbar de aviso— sobre blanco, y dos familias tipográficas de uso libre.<\u002Fp>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1px;background:#E3E3DF;border:1px solid #E3E3DF;border-radius:3px;overflow:hidden\">\n<div style=\"background:#FFFFFF;padding:24px\">\n<p style=\"margin:0 0 16px;font:700 10.5px/1 'Public Sans';letter-spacing:.16em;color:#7C7C73\">TIPOGRAFÍA<\u002Fp>\n<p style=\"margin:0 0 4px;font:700 34px/1.05 'Zilla Slab',serif\">Tortuga mora<\u002Fp>\n<p style=\"margin:0 0 14px;font:400 italic 18px/1.2 'Public Sans';color:#6A6A61\">Testudo graeca<\u002Fp>\n<p style=\"margin:0 0 4px;font:600 13px/1.4 'Public Sans'\">Public Sans · interfaz y datos<\u002Fp>\n<p style=\"margin:0;font:700 11px/1.4 'Public Sans';letter-spacing:.14em;color:#6A6A61\">VERSALITAS · CÓDIGO 5220*<\u002Fp>\n<\u002Fdiv>\n<div style=\"background:#FFFFFF;padding:24px\">\n<p style=\"margin:0 0 16px;font:700 10.5px/1 'Public Sans';letter-spacing:.16em;color:#7C7C73\">COLOR<\u002Fp>\n<div style=\"display:flex;gap:6px;margin-bottom:14px\">\n<span style=\"width:44px;height:44px;border-radius:2px;background:#1F4D34\"><\u002Fspan>\n<span style=\"width:44px;height:44px;border-radius:2px;background:#4A3B2A\"><\u002Fspan>\n<span style=\"width:44px;height:44px;border-radius:2px;background:#C4A15E\"><\u002Fspan>\n<span style=\"width:44px;height:44px;border-radius:2px;background:#C4762A\"><\u002Fspan>\n<span style=\"width:44px;height:44px;border-radius:2px;background:#2E6D8E\"><\u002Fspan>\n<span style=\"width:44px;height:44px;border-radius:2px;background:#FFFFFF;border:1px solid #E3E3DF\"><\u002Fspan>\n<\u002Fdiv>\n<p style=\"margin:0;font:500 12px/1.6 'Public Sans';color:#6A6A61\">#1F4D34 verde parque · #4A3B2A marrón cartel<br>#C4A15E latón · #C4762A aviso · #2E6D8E agua<br>#FFFFFF arena · #1A1A17 tinta<\u002Fp>\n<\u002Fdiv>\n<div style=\"background:#FFFFFF;padding:24px\">\n<p style=\"margin:0 0 16px;font:700 10.5px/1 'Public Sans';letter-spacing:.16em;color:#7C7C73\">FORMA<\u002Fp>\n<div style=\"display:flex;flex-wrap:wrap;gap:13px;margin-bottom:14px;color:#1F4D34\">\n<svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linejoin=\"round\"><path d=\"M9 4 3 6.4v14L9 18l6 2.6 6-2.6v-14L15 6.4 9 4Z\"><\u002Fpath><path d=\"M9 4v14M15 6.4v14.2\"><\u002Fpath><\u002Fsvg>\n<svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linejoin=\"round\"><path d=\"M4 4h5a3 3 0 0 1 3 3v13a2.6 2.6 0 0 0-2.6-2H4V4Z\"><\u002Fpath><path d=\"M20 4h-5a3 3 0 0 0-3 3v13a2.6 2.6 0 0 1 2.6-2H20V4Z\"><\u002Fpath><\u002Fsvg>\n<svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\"><circle cx=\"12\" cy=\"12\" r=\"3\"><\u002Fcircle><circle cx=\"12\" cy=\"12\" r=\"8.2\" opacity=\".5\"><\u002Fcircle><path d=\"M12 1.6v2.6M12 19.8v2.6M22.4 12h-2.6M4.2 12H1.6\"><\u002Fpath><\u002Fsvg>\n<svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"9\" r=\"5.6\"><\u002Fcircle><path d=\"M8.6 13.6 7 22l5-2.7L17 22l-1.6-8.4\"><\u002Fpath><\u002Fsvg>\n<svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 21c6-2 9-6.4 9-12V4l-9 3-9-3v5c0 5.6 3 10 9 12Z\"><\u002Fpath><\u002Fsvg>\n<svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linejoin=\"round\"><path d=\"M5 21V8l7-4 7 4v13\"><\u002Fpath><path d=\"M10 21v-5h4v5\"><\u002Fpath><\u002Fsvg>\n<\u002Fdiv>\n<p style=\"margin:0;font-size:12.5px;line-height:1.6;color:#6A6A61\">Radios 2-4 px, filetes de 4 px, trazo 1,7-2 px. Nada de sombras difusas: separación por línea y color, como en un panel interpretativo.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin:34px 0 0;padding:26px;background:#1A1A17;border-radius:3px\">\n<p style=\"margin:0 0 8px;font:700 10.5px/1 'Public Sans';letter-spacing:.16em;color:#C4A15E\">PARA IMPLEMENTAR<\u002Fp>\n<h3 style=\"margin:0 0 12px;font:600 24px/1.2 'Zilla Slab',serif;color:#FFFFFF\">naturdex-tokens.css<\u002Fh3>\n<p style=\"margin:0 0 18px;max-width:64ch;font-size:14px;line-height:1.65;color:#B5B5AD\">Está escrito en el proyecto, listo para copiar a <code style=\"font:500 13px/1 'Public Sans';background:#2A2A25;padding:2px 6px;color:#E7E7E3\">Frontend/Css/<\u002Fcode>. Redefine las variables que <strong style=\"color:#FFFFFF;font-weight:600\">ya existen<\u002Fstrong> en tu <code style=\"font:500 13px/1 'Public Sans';background:#2A2A25;padding:2px 6px;color:#E7E7E3\">styles.css<\u002Fcode> (<code style=\"font:500 13px/1 'Public Sans';background:#2A2A25;padding:2px 6px;color:#E7E7E3\">--ink --muted --line --paper --panel --leaf --sea --sun<\u002Fcode>), así que cargándolo antes cambia la piel de casi toda la app sin reescribir reglas. Incluye el bloque <code style=\"font:500 13px/1 'Public Sans';background:#2A2A25;padding:2px 6px;color:#E7E7E3\">html[data-theme=\"dark\"]<\u002Fcode> que <code style=\"font:500 13px/1 'Public Sans';background:#2A2A25;padding:2px 6px;color:#E7E7E3\">prefs.js<\u002Fcode> ya sabe activar, y las piezas nuevas (<code style=\"font:500 13px/1 'Public Sans';background:#2A2A25;padding:2px 6px;color:#E7E7E3\">.park-sign .caps .rule-row .notice-bar .patch<\u002Fcode>).<\u002Fp>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px\">\n<div><p style=\"margin:0 0 6px;font:700 10px/1 'Public Sans';letter-spacing:.14em;color:#7C7C73\">ORDEN SUGERIDO<\u002Fp><ol style=\"margin:0;padding-left:18px;font-size:13.5px;line-height:1.75;color:#B5B5AD\"><li>Cargar los tokens y las dos fuentes en <code style=\"font:500 12.5px/1 'Public Sans';background:#2A2A25;padding:1px 5px;color:#E7E7E3\">index.html<\u002Fcode>.<\u002Fli><li>Bajar los radios de 8-14 px a 2-4 px en styles.css.<\u002Fli><li>Sustituir los emoji del mapa por el set de iconos de trazo.<\u002Fli><li>Reestructurar el móvil: mapa de fondo + hoja (es el cambio grande).<\u002Fli><\u002Fol><\u002Fdiv>\n<div><p style=\"margin:0 0 6px;font:700 10px/1 'Public Sans';letter-spacing:.14em;color:#7C7C73\">SIGUE PENDIENTE<\u002Fp><ul style=\"margin:0;padding-left:18px;font-size:13.5px;line-height:1.75;color:#B5B5AD\"><li>Fotos con licencia confirmada (hoy hay marcadores).<\u002Fli><li>Perfil y ajustes, y progreso estatal, con el uniforme nuevo.<\u002Fli><li>Ilustración real para el onboarding.<\u002Fli><\u002Ful><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<p style=\"margin:22px 0 0;max-width:70ch;font-size:12.5px;line-height:1.6;color:#7C7C73\">Nota: la paleta y el planteamiento se inspiran en la señalética de parques nacionales, pero no se reproduce ningún emblema, marca ni tipografía propietaria del National Park Service. Zilla Slab y Public Sans son de uso libre.<\u002Fp>\n<\u002Fsection>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;gamificacion&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;visible&quot;,&quot;oculta&quot;],&quot;default&quot;:&quot;visible&quot;,&quot;tsType&quot;:&quot;'visible' | 'oculta'&quot;,&quot;section&quot;:&quot;Contenido&quot;}}\">\nconst SPECIES = [\n  { id: 1, common: 'Azufaifo', sci: 'Ziziphus lotus', kind: 'flora', status: 'VULNERABLE · MURCIA' },\n  { id: 2, common: 'Cornical', sci: 'Periploca angustifolia', kind: 'flora', status: 'VULNERABLE · MURCIA' },\n  { id: 3, common: 'Tortuga mora', sci: 'Testudo graeca', kind: 'fauna', status: 'VULNERABLE · UICN' },\n  { id: 4, common: 'Chova piquirroja', sci: 'Pyrrhocorax pyrrhocorax', kind: 'fauna', status: 'INTERÉS ESPECIAL' },\n  { id: 5, common: 'Arto', sci: 'Maytenus senegalensis subsp. europaea', kind: 'flora', status: 'VULNERABLE · MURCIA' },\n  { id: 6, common: 'Águila perdicera', sci: 'Aquila fasciata', kind: 'fauna', status: 'EN PELIGRO · MURCIA' }\n];\n\nconst TAX = {\n  1: { clase: 'Magnoliopsida', orden: 'Rosales', familia: 'Rhamnaceae' },\n  2: { clase: 'Magnoliopsida', orden: 'Gentianales', familia: 'Apocynaceae' },\n  3: { clase: 'Reptilia', orden: 'Testudines', familia: 'Testudinidae' },\n  4: { clase: 'Aves', orden: 'Passeriformes', familia: 'Corvidae' },\n  5: { clase: 'Magnoliopsida', orden: 'Celastrales', familia: 'Celastraceae' },\n  6: { clase: 'Aves', orden: 'Accipitriformes', familia: 'Accipitridae' }\n};\n\nconst DESC = {\n  1: 'Arbusto espinoso que forma los azufaifares, el hábitat prioritario 5220* del parque. Sus montículos de arena atrapada bajo las ramas dan refugio a la tortuga mora y a la lagartija colirroja.',\n  2: 'Arbusto de hoja estrecha y látex blanco, característico de la asociación Mayteno-Periplocetum angustifoliae. Reliquia de flora norteafricana en la costa murciana.',\n  3: 'Único quelonio terrestre de la Región de Murcia. Vive en el matorral semiárido y en los azufaifares, donde encuentra sombra y humedad en verano. Si la encuentras, no la muevas de sitio: desplazarla la desorienta durante semanas.',\n  4: 'Córvido de pico rojo curvo y vuelo acrobático, ligado a los cortados rocosos del parque. Se detecta antes por su reclamo agudo que por la vista.',\n  5: 'Arbusto espinoso de porte denso, indicador del hábitat prioritario 5220*. Su nombre común da nombre a los artales de la Marina de Cope.',\n  6: 'Rapaz de tamaño medio que cría en los cortados del macizo de Cope. Catalogada en peligro de extinción en la Región de Murcia por la Ley 7/1995.'\n};\n\nclass Component extends DCLogic {\n  state = { tab: 'mapa', selected: 3, cercaOpen: false, seen: [1, 2] };\n\n  tabStyle(active) {\n    const base = 'flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding:7px 0;border:0;border-radius:3px;cursor:pointer;font:700 9.5px/1 \"Public Sans\";letter-spacing:.1em;';\n    return active\n      ? base + 'background:#1F4D34;color:#FFFFFF'\n      : base + 'background:transparent;color:#7C7C73';\n  }\n\n  renderVals() {\n    const { tab, selected, cercaOpen, seen } = this.state;\n    const sel = SPECIES.find(s => s.id === selected) || SPECIES[0];\n    const isSeen = seen.indexOf(sel.id) !== -1;\n    const seenCount = 10 + seen.length;\n    const tax = TAX[sel.id] || {};\n\n    return {\n      isMapa: tab === 'mapa',\n      isCatalogo: tab === 'catalogo',\n      isFicha: tab === 'ficha',\n      isProgreso: tab === 'progreso',\n      cercaOpen,\n      seenCount,\n      pctLabel: Math.round((seenCount / 78) * 100) + '%',\n      showStreak: (this.props.gamificacion ?? 'visible') !== 'oculta',\n\n      species: SPECIES.map(s => ({\n        ...s,\n        seen: seen.indexOf(s.id) !== -1,\n        kindLabel: s.kind === 'fauna' ? 'FAUNA' : 'FLORA',\n        tint: s.kind === 'fauna' ? '#DCE6E9' : '#E3E7D6',\n        tintInk: s.kind === 'fauna' ? '#6E8E99' : '#7C8A62',\n        statusInk: s.status.indexOf('PELIGRO') !== -1 ? '#A0451F' : '#7C7C73',\n        open: () => this.setState({ selected: s.id, tab: 'ficha' })\n      })),\n\n      fichaCommon: sel.common,\n      fichaSci: sel.sci,\n      fichaKindUpper: sel.kind === 'fauna' ? 'FAUNA' : 'FLORA',\n      fichaDesc: DESC[sel.id] || '',\n      taxClase: tax.clase || '—',\n      taxOrden: tax.orden || '—',\n      taxFamilia: tax.familia || '—',\n      seenBtnLabel: isSeen ? 'VISTA EL 12 DE AGOSTO' : 'MARCAR COMO VISTA',\n      seenHint: isSeen\n        ? 'Registrada a 37,4231 N · 1,4903 W con el GPS del móvil.'\n        : 'Guardaremos el punto exacto donde estás ahora mismo.',\n      seenBtnStyle: 'display:flex;align-items:center;justify-content:center;gap:9px;width:100%;min-height:52px;border-radius:3px;cursor:pointer;font:700 14.5px/1 \"Public Sans\";letter-spacing:.08em;' +\n        (isSeen\n          ? 'border:0;background:#1F4D34;color:#FFFFFF'\n          : 'border:2px solid #1F4D34;background:transparent;color:#1F4D34'),\n\n      tabMapaStyle: this.tabStyle(tab === 'mapa'),\n      tabCatalogoStyle: this.tabStyle(tab === 'catalogo' || tab === 'ficha'),\n      tabCercaStyle: this.tabStyle(cercaOpen),\n      tabProgresoStyle: this.tabStyle(tab === 'progreso'),\n\n      goMapa: () => this.setState({ tab: 'mapa' }),\n      goCatalogo: () => this.setState({ tab: 'catalogo', cercaOpen: false }),\n      goProgreso: () => this.setState({ tab: 'progreso', cercaOpen: false }),\n      toggleCerca: () => this.setState(s => ({ cercaOpen: !s.cercaOpen, tab: 'mapa' })),\n      toggleSeen: () => this.setState(s => ({\n        seen: s.seen.indexOf(sel.id) !== -1 ? s.seen.filter(i => i !== sel.id) : s.seen.concat(sel.id)\n      }))\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
