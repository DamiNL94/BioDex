services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8090:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/var/www/frontend:ro
    depends_on:
      - php

  php:
    build: ./docker/php
    env_file: .env
    volumes:
      - ./backend:/var/www/backend
      # Scripts de backend/bin que escriben muestras en docs/ (F1: eidos-spike.php)
      - ./docs:/var/www/docs
      # Reglas compartidas con el frontend (sensibilidad, UICN, DwC): solo lectura
      - ./shared:/var/www/shared:ro
    depends_on:
      - mysql
      - mailpit

  # SMTP de desarrollo: recoge todo el correo saliente (SMTP mailpit:1025, bandeja en http://localhost:8025)
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
      # La app nunca usa root: se genera una contraseña aleatoria (sale en el log del primer arranque).
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - ./mysql-data:/var/lib/mysql

  adminer:
    image: adminer:latest
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    depends_on:
      - mysql
