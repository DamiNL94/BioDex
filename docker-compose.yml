services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8090:80"
      # HTTPS para probar en el móvil; solo responde si hay certificados en docker/nginx/certs/ (README)
      - "8443:443"
    # entrypoint.sh activa https.conf si existen los certificados y luego sigue con el de la imagen
    entrypoint: ["/bin/sh", "/etc/nginx/biodex/entrypoint.sh"]
    command: ["nginx", "-g", "daemon off;"]
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/biodex-app.conf:/etc/nginx/biodex/biodex-app.conf:ro
      - ./docker/nginx/security-headers.conf:/etc/nginx/biodex/security-headers.conf:ro
      - ./docker/nginx/https.conf:/etc/nginx/biodex/https.conf:ro
      - ./docker/nginx/entrypoint.sh:/etc/nginx/biodex/entrypoint.sh:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
      - ./frontend:/var/www/frontend:ro
      # Motor y umbrales UICN (F8b) y EOO/AOO (F9) compartidos con Node: solo se sirven iucn-engine.js,
      # iucn-criteria.json y geo-metrics.js de /shared/ (biodex-app.conf)
      - ./shared:/var/www/shared:ro
    depends_on:
      - php

  php:
    build: ./docker/php
    env_file: .env
    volumes:
      - ./backend:/var/www/backend
      # Scripts de backend/bin que escriben muestras en docs/ (F1: eidos-spike.php)
      - ./docs:/var/www/docs
      # Reglas compartidas con el frontend (sensibilidad, UICN, DwC): solo lectura
      - ./shared:/var/www/shared:ro
      # Solo lectura, para bin/check-sw.php (SHELL_ASSETS de sw.js contra el disco)
      - ./frontend:/var/www/frontend:ro
    depends_on:
      - mysql
      - mailpit

  # SMTP de desarrollo: recoge todo el correo saliente (SMTP mailpit:1025, bandeja en http://localhost:8025)
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
      # La app nunca usa root: se genera una contraseña aleatoria (sale en el log del primer arranque).
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - ./mysql-data:/var/lib/mysql

  adminer:
    image: adminer:latest
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    depends_on:
      - mysql
