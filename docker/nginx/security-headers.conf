# Cabeceras de seguridad de BioDex (frontend y API). Se incluye en cada `location` que tenga su propio
# add_header: en nginx, un add_header dentro de una location anula TODOS los heredados del server.
# img-src solo del mismo origen: las fotos de la Fototeca llegan por el proxy /img/fototeca/ (F5a).
# Sin 'unsafe-inline': nada de <script> ni style="" en línea en el frontend.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; connect-src 'self'; style-src 'self'; script-src 'self'; font-src 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
