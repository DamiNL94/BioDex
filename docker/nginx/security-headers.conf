# Cabeceras de seguridad de BioDex (frontend y API). Se incluye en cada `location` que tenga su propio
# add_header: en nginx, un add_header dentro de una location anula TODOS los heredados del server.
# img-src admite las fotos de especies de MITECO (EIDOS). Sin 'unsafe-inline': nada de <script> ni
# style="" en línea en el frontend.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://www.miteco.gob.es; connect-src 'self'; style-src 'self'; script-src 'self'; font-src 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
