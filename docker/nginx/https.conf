# HTTPS para probar en el móvil (GPS y Service Worker exigen contexto seguro). Opción A del README:
# certificados de mkcert en docker/nginx/certs/. Solo se carga si existen (ver entrypoint.sh).
server {
    listen 443 ssl;
    http2 on;
    server_name _;
    ssl_certificate     /etc/nginx/certs/biodex.pem;
    ssl_certificate_key /etc/nginx/certs/biodex-key.pem;
    include /etc/nginx/biodex/biodex-app.conf;
}
