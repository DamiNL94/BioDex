# Caché de teselas del IGN (F7, location de /tiles/ en biodex-app.conf). 30 días sin uso → fuera.
# proxy_cache_path y los map tienen que ir en el contexto http, que es donde se incluye este fichero.
proxy_cache_path /var/cache/nginx/tiles levels=1:2 keys_zone=tiles:10m max_size=2g inactive=30d use_temp_path=off;

# Capas del IGN por clave (verificadas con GetCapabilities, docs/mapa.md). Servicio, capa, formato y
# zoom máximo son FIJOS por clave: de la URL del cliente solo se usan z/x/y, y solo si son números.
map $tile_key $tile_service {
    base ign-base;
    pnoa pnoa-ma;
    mtn  mapa-raster;
}
map $tile_key $tile_layer {
    base IGNBaseTodo;
    pnoa OI.OrthoimageCoverage;
    mtn  MTN;
}
# Las tres en JPEG (IGN Base en PNG pesa ~6 veces más). La extensión de la URL tiene que ser la suya.
map "$tile_key.$tile_ext" $tile_ok_ext {
    base.jpg 1;
    pnoa.jpg 1;
    mtn.jpg  1;
    default  0;
}
# Zoom máximo: base 20 (vectorial rasterizado, nítido hasta 20), PNOA 19 (25 cm/px), MTN 17 (1:25.000;
# desde 18 el IGN solo remuestrea). Fuera de rango → 404 sin llamar al IGN.
map "$tile_key/$tile_z" $tile_ok_zoom {
    "~^base/([0-9]|1[0-9]|20)$" 1;
    "~^pnoa/([0-9]|1[0-9])$"    1;
    "~^mtn/([0-9]|1[0-7])$"     1;
    default 0;
}

# Caché de las fotos de la Fototeca (location /img/fototeca/ de biodex-app.conf, F5a).
proxy_cache_path /var/cache/nginx/fototeca levels=1:2 keys_zone=fototeca:10m max_size=1g inactive=30d use_temp_path=off;

server {
    listen 80;
    server_name _;
    include /etc/nginx/biodex/biodex-app.conf;
}

# El servidor HTTPS (puerto 8443, para probar en el móvil) está en https.conf y solo se activa si
# existen los certificados de mkcert en docker/nginx/certs/ (lo decide entrypoint.sh).
