# Caché de teselas del IGN (se activa en F6 junto con `location /tiles/`).
# proxy_cache_path tiene que ir en el contexto http, que es donde se incluye este fichero.
# proxy_cache_path /var/cache/nginx/tiles levels=1:2 keys_zone=tiles:10m max_size=2g inactive=30d use_temp_path=off;

server {
    listen 80;
    server_name _;

    root /var/www/frontend;
    index index.html;

    # Frontend estático (PWA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API: todo /api/* entra por el router único de PHP
    location /api/ {
        fastcgi_pass php:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
    }

    # Teselas WMTS del IGN servidas desde el mismo origen (F6).
    # /tiles/ign-base/...  /tiles/pnoa-ma/...  /tiles/mapa-raster/...
    # location /tiles/ {
    #     proxy_pass https://www.ign.es/wmts/;
    #     proxy_ssl_server_name on;
    #     proxy_set_header Host www.ign.es;
    #     proxy_cache tiles;
    #     proxy_cache_valid 200 30d;
    #     proxy_cache_use_stale error timeout updating;
    #     proxy_ignore_headers Cache-Control Expires Set-Cookie;
    #     add_header X-Cache-Status $upstream_cache_status;
    # }
}
