# Rutas de BioDex, comunes al servidor HTTP (80 → 8090) y al HTTPS opcional (443 → 8443).
root /var/www/frontend;
index index.html;

include /etc/nginx/biodex/security-headers.conf;

# El armazón de la PWA tiene que revalidarse siempre: un sw.js o un index.html viejos en la caché
# HTTP dejan al móvil atascado en una versión anterior.
location = /sw.js {
    include /etc/nginx/biodex/security-headers.conf;
    add_header Cache-Control "no-cache" always;
}
location = /index.html {
    include /etc/nginx/biodex/security-headers.conf;
    add_header Cache-Control "no-cache" always;
}

# Frontend estático (PWA); las rutas desconocidas devuelven index.html (sin caché, como arriba).
location / {
    try_files $uri $uri/ /index.html;
}

# Motor UICN y sus umbrales (F8b), servidos desde shared/ tal cual: una sola fuente para el navegador y
# para las pruebas de Node (shared/iucn-engine.test.js). Solo esos dos ficheros; el resto de /shared/ → 404.
# Sin caché HTTP larga: el SW los precachea y los renueva con cada VERSION, como el resto del armazón.
location ~ "^/shared/(iucn-engine\.js|iucn-criteria\.json)$" {
    root /var/www;
    include /etc/nginx/biodex/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    limit_except GET { deny all; }
}
location /shared/ {
    return 404;
}

# API: todo /api/* entra por el router único de PHP
location /api/ {
    fastcgi_pass php:9000;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
    fastcgi_param SCRIPT_NAME /index.php;
}

# Fotos de la Fototeca del MITECO servidas desde nuestro origen (F5a): el móvil las guarda para usarlas
# sin red, y con CORS de mismo origen no ocupan como respuestas «opacas» (~7 MB de cuota cada una).
# SOLO /img/fototeca/<carpetas>/<fichero>.<jpg|png|webp|gif>, sin parámetros. Se comprueba sobre
# $request_uri (la URI tal como llega): nginx normaliza «..» antes de elegir location, y
# /img/fototeca/../x acabaría en `location /` devolviendo index.html. Se mira también $uri (ya
# decodificada) para cerrar /img/%66ototeca/... Todo lo demás bajo /img/fototeca/ → 400.
set $img_bad "";
if ($request_uri ~* "^/img/fototeca/") { set $img_bad "1"; }
if ($uri ~* "^/img/fototeca/") { set $img_bad "1"; }
if ($request_uri ~* "^/img/fototeca/[a-z0-9_-]+(/[a-z0-9_-]+)*\.(jpe?g|png|webp|gif)$") { set $img_bad ""; }
if ($img_bad) { return 400; }

location ~* "^/img/fototeca/(?<fototeca_path>[a-z0-9_-]+(?:/[a-z0-9_-]+)*\.(?:jpe?g|png|webp|gif))$" {
    include /etc/nginx/biodex/security-headers.conf;
    limit_except GET { deny all; }
    # Resolución en tiempo de ejecución (DNS de Docker): sin red al arrancar, nginx arranca igual.
    resolver 127.0.0.11 ipv6=off valid=300s;
    set $fototeca_upstream "https://www.miteco.gob.es";
    proxy_pass $fototeca_upstream/content/dam/fototeca/$fototeca_path;
    proxy_ssl_server_name on;
    proxy_set_header Host www.miteco.gob.es;
    proxy_set_header Cookie "";
    proxy_set_header Referer "";
    proxy_hide_header Set-Cookie;
    # Las cabeceras de caché y seguridad son las nuestras, no las de MITECO (su HSTS de 2 años fijaría
    # HTTPS para localhost en el móvil de pruebas).
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-XSS-Protection;
    proxy_hide_header Cross-Origin-Opener-Policy;
    proxy_hide_header Cross-Origin-Resource-Policy;
    proxy_hide_header X-Dispatcher;
    proxy_hide_header X-Vhost;
    proxy_hide_header x-azure-ref;
    proxy_hide_header x-fd-int-roxy-purgeid;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Cache-Control;
    proxy_hide_header Expires;
    proxy_hide_header X-Cache;
    proxy_hide_header X-Cache-Info;
    proxy_cache fototeca;
    proxy_cache_valid 200 30d;
    proxy_cache_valid 404 1h;
    proxy_cache_use_stale error timeout updating;
    proxy_ignore_headers Cache-Control Expires Set-Cookie;
    add_header Cache-Control "public, max-age=2592000" always;
    add_header X-Cache-Status $upstream_cache_status always;
}

# Teselas WMTS del IGN servidas desde el mismo origen (F7): /tiles/<clave>/<z>/<x>/<y>.jpg → GetTile KVP.
# Servicio, capa, formato y zoom máximo salen de la clave (map de default.conf); del cliente solo se
# toman z/x/y, y solo como números. Forma válida pero clave, extensión o zoom desconocidos → 404.
# Guarda previa sobre $request_uri (la URI tal como llega): parámetros, %-codificados o coordenadas que
# no son números → 400. Va fuera de la location porque allí el error_page 400 (fila fuera de la rejilla
# del IGN) lo convertiría en 404.
set $tile_bad "";
if ($request_uri ~ "^/tiles/") { set $tile_bad "1"; }
if ($request_uri ~ "^/tiles/[a-z]+/\d{1,2}/\d{1,7}/\d{1,7}\.(png|jpg)$") { set $tile_bad ""; }
if ($tile_bad) { return 400; }

# Mismo trato que la Fototeca: cabeceras de caché y de seguridad nuestras, caché de 30 días.
location ~ "^/tiles/(?<tile_key>base|pnoa|mtn)/(?<tile_z>\d{1,2})/(?<tile_x>\d{1,7})/(?<tile_y>\d{1,7})\.(?<tile_ext>png|jpg)$" {
    include /etc/nginx/biodex/security-headers.conf;
    limit_except GET { deny all; }
    if ($tile_ok_ext = 0) { return 404; }
    if ($tile_ok_zoom = 0) { return 404; }
    resolver 127.0.0.11 ipv6=off valid=300s;
    set $tile_upstream "https://www.ign.es";
    proxy_pass "$tile_upstream/wmts/$tile_service?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=$tile_layer&STYLE=default&TILEMATRIXSET=GoogleMapsCompatible&TILEMATRIX=$tile_z&TILEROW=$tile_y&TILECOL=$tile_x&FORMAT=image/jpeg";
    proxy_ssl_server_name on;
    proxy_set_header Host www.ign.es;
    proxy_set_header Cookie "";
    proxy_set_header Referer "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
    proxy_hide_header Set-Cookie;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Content-Disposition;
    proxy_hide_header Cache-Control;
    proxy_hide_header Expires;
    proxy_hide_header Last-Modified;
    proxy_hide_header X-Cache;
    proxy_hide_header Via;
    proxy_hide_header X-Amz-Cf-Pop;
    proxy_hide_header X-Amz-Cf-Id;
    proxy_hide_header geowebcache-tile-index;
    proxy_hide_header geowebcache-cache-result;
    proxy_hide_header geowebcache-tile-bounds;
    proxy_hide_header geowebcache-gridset;
    proxy_hide_header geowebcache-crs;
    proxy_cache tiles;
    proxy_cache_key "$tile_key/$tile_z/$tile_x/$tile_y";
    proxy_cache_valid 200 30d;
    proxy_cache_use_stale error timeout updating;
    proxy_cache_lock on;
    proxy_ignore_headers Cache-Control Expires Set-Cookie;
    # El IGN contesta 400 (XML) a una fila o columna fuera de la rejilla: para el cliente, no hay tesela.
    proxy_intercept_errors on;
    error_page 400 403 404 = @tile_missing;
    error_page 500 502 503 504 = @tile_upstream_down;
    add_header Cache-Control "public, max-age=2592000" always;
    add_header X-Cache-Status $upstream_cache_status always;
}
location @tile_missing {
    include /etc/nginx/biodex/security-headers.conf;
    add_header Cache-Control "no-store" always;
    return 404;
}
location @tile_upstream_down {
    include /etc/nginx/biodex/security-headers.conf;
    add_header Cache-Control "no-store" always;
    return 502;
}
location /tiles/ {
    return 404;
}
