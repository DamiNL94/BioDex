# Rutas de BioDex, comunes al servidor HTTP (80 → 8090) y al HTTPS opcional (443 → 8443).
root /var/www/frontend;
index index.html;

include /etc/nginx/biodex/security-headers.conf;

# El armazón de la PWA tiene que revalidarse siempre: un sw.js o un index.html viejos en la caché
# HTTP dejan al móvil atascado en una versión anterior.
location = /sw.js {
    include /etc/nginx/biodex/security-headers.conf;
    add_header Cache-Control "no-cache" always;
}
location = /index.html {
    include /etc/nginx/biodex/security-headers.conf;
    add_header Cache-Control "no-cache" always;
}

# Frontend estático (PWA); las rutas desconocidas devuelven index.html (sin caché, como arriba).
location / {
    try_files $uri $uri/ /index.html;
}

# API: todo /api/* entra por el router único de PHP
location /api/ {
    fastcgi_pass php:9000;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
    fastcgi_param SCRIPT_NAME /index.php;
}

# Fotos de la Fototeca del MITECO servidas desde nuestro origen (F5a): el móvil las guarda para usarlas
# sin red, y con CORS de mismo origen no ocupan como respuestas «opacas» (~7 MB de cuota cada una).
# SOLO /img/fototeca/<carpetas>/<fichero>.<jpg|png|webp|gif>, sin parámetros. Se comprueba sobre
# $request_uri (la URI tal como llega): nginx normaliza «..» antes de elegir location, y
# /img/fototeca/../x acabaría en `location /` devolviendo index.html. Se mira también $uri (ya
# decodificada) para cerrar /img/%66ototeca/... Todo lo demás bajo /img/fototeca/ → 400.
set $img_bad "";
if ($request_uri ~* "^/img/fototeca/") { set $img_bad "1"; }
if ($uri ~* "^/img/fototeca/") { set $img_bad "1"; }
if ($request_uri ~* "^/img/fototeca/[a-z0-9_-]+(/[a-z0-9_-]+)*\.(jpe?g|png|webp|gif)$") { set $img_bad ""; }
if ($img_bad) { return 400; }

location ~* "^/img/fototeca/(?<fototeca_path>[a-z0-9_-]+(?:/[a-z0-9_-]+)*\.(?:jpe?g|png|webp|gif))$" {
    include /etc/nginx/biodex/security-headers.conf;
    limit_except GET { deny all; }
    # Resolución en tiempo de ejecución (DNS de Docker): sin red al arrancar, nginx arranca igual.
    resolver 127.0.0.11 ipv6=off valid=300s;
    set $fototeca_upstream "https://www.miteco.gob.es";
    proxy_pass $fototeca_upstream/content/dam/fototeca/$fototeca_path;
    proxy_ssl_server_name on;
    proxy_set_header Host www.miteco.gob.es;
    proxy_set_header Cookie "";
    proxy_set_header Referer "";
    proxy_hide_header Set-Cookie;
    # Las cabeceras de caché y seguridad son las nuestras, no las de MITECO (su HSTS de 2 años fijaría
    # HTTPS para localhost en el móvil de pruebas).
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-XSS-Protection;
    proxy_hide_header Cross-Origin-Opener-Policy;
    proxy_hide_header Cross-Origin-Resource-Policy;
    proxy_hide_header X-Dispatcher;
    proxy_hide_header X-Vhost;
    proxy_hide_header x-azure-ref;
    proxy_hide_header x-fd-int-roxy-purgeid;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Cache-Control;
    proxy_hide_header Expires;
    proxy_hide_header X-Cache;
    proxy_hide_header X-Cache-Info;
    proxy_cache fototeca;
    proxy_cache_valid 200 30d;
    proxy_cache_valid 404 1h;
    proxy_cache_use_stale error timeout updating;
    proxy_ignore_headers Cache-Control Expires Set-Cookie;
    add_header Cache-Control "public, max-age=2592000" always;
    add_header X-Cache-Status $upstream_cache_status always;
}

