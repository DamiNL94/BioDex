# Comprobaciones que no necesitan MySQL ni red: sintaxis de PHP, Service Worker al día y pruebas de JS.
# Las baterías de integración (backend/bin/test-all.php) se ejecutan en local con Docker.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_mysql, zip, intl

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Sintaxis de PHP
        run: find backend -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: SHELL_ASSETS del Service Worker al día
        run: php backend/bin/check-sw.php

      - name: Suficiencia de datos y calidad mínima en PHP (mismos casos que JS, sin base de datos)
        run: php backend/bin/test-sufficiency.php

      - name: Pruebas de JS (motor UICN y series, EOO/AOO, UTM, conteo, QR, buscador y geometría de sitios)
        run: |
          node shared/iucn-engine.test.js
          node shared/geo-metrics.test.js
          node frontend/tests/utm.test.mjs
          node frontend/tests/tally.test.mjs
          node frontend/tests/qr.test.mjs
          node frontend/tests/species-search.test.mjs
          node frontend/tests/site-geom.test.mjs

  # Los casos de series (shared/iucn-cases.json › series) salen de bin/series-reference.py con statsmodels: se
  # regeneran y no deben cambiar (referencia independiente y reproducible del ajuste de Poisson).
  series-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Casos de series con statsmodels
        run: |
          pip install statsmodels==0.15.0
          python -I backend/bin/series-reference.py --write
          git diff --exit-code shared/iucn-cases.json

  # Interfaz con Playwright y la API simulada (frontend/tests/e2e), móvil y escritorio.
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/tests/e2e
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test

      - name: Informe si falla
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/tests/e2e/playwright-report
            frontend/tests/e2e/test-results
