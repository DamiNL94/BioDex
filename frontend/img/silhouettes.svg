<svg xmlns="http://www.w3.org/2000/svg">
  <!--
    Siluetas de respaldo de BioDex (F11b): dibujo propio y original, sin trazos de terceros.
    Una por grupo de shared/species-groups.json (id = "sil-<grupo>"). Todas en una rejilla de 48×48 y en
    currentColor: el color lo pone el CSS de quien las usa (<svg><use href="img/silhouettes.svg#sil-…"/></svg>).
  -->

  <!-- planta con flor: tallo, dos hojas y flor de cinco pétalos -->
  <symbol id="sil-flowering-plant" viewBox="0 0 48 48">
    <rect x="22.8" y="19" width="2.4" height="26" rx="1.2" fill="currentColor"/>
    <ellipse cx="16" cy="33" rx="7.5" ry="3" transform="rotate(-28 16 33)" fill="currentColor"/>
    <ellipse cx="32" cy="29" rx="7.5" ry="3" transform="rotate(28 32 29)" fill="currentColor"/>
    <g fill="currentColor">
      <circle cx="24" cy="7.4" r="4"/>
      <circle cx="30.3" cy="12" r="4"/>
      <circle cx="27.9" cy="19.4" r="4"/>
      <circle cx="20.1" cy="19.4" r="4"/>
      <circle cx="17.7" cy="12" r="4"/>
    </g>
    <circle cx="24" cy="14" r="2.3" fill="currentColor" opacity=".55"/>
  </symbol>

  <!-- helecho: fronda con pinnas que se acortan hacia el ápice y báculo enrollado -->
  <symbol id="sil-fern" viewBox="0 0 48 48">
    <path d="M24 46 C24 34 24.5 22 26 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <path d="M26 12 c1-4 5-5 6.5-2.5 c1.2 2-1 4-2.7 2.6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <g fill="currentColor">
      <ellipse cx="16" cy="38" rx="8.5" ry="2.4" transform="rotate(-18 16 38)"/>
      <ellipse cx="32" cy="36" rx="8.5" ry="2.4" transform="rotate(18 32 36)"/>
      <ellipse cx="17" cy="31" rx="7.5" ry="2.2" transform="rotate(-20 17 31)"/>
      <ellipse cx="31.5" cy="29" rx="7.5" ry="2.2" transform="rotate(20 31.5 29)"/>
      <ellipse cx="18.5" cy="24" rx="6" ry="2" transform="rotate(-22 18.5 24)"/>
      <ellipse cx="31" cy="22" rx="6" ry="2" transform="rotate(22 31 22)"/>
      <ellipse cx="20.5" cy="17.5" rx="4.2" ry="1.7" transform="rotate(-24 20.5 17.5)"/>
      <ellipse cx="30.5" cy="16" rx="3.6" ry="1.6" transform="rotate(24 30.5 16)"/>
    </g>
  </symbol>

  <!-- gimnosperma: conífera de tres pisos con tronco -->
  <symbol id="sil-gymnosperm" viewBox="0 0 48 48">
    <g fill="currentColor">
      <rect x="21.5" y="37" width="5" height="9" rx="1"/>
      <path d="M24 3 L33 15 L28.5 15 L37 26 L31.5 26 L41 38 L7 38 L16.5 26 L11 26 L19.5 15 L15 15 Z"/>
    </g>
  </symbol>

  <!-- briófito: cojín de musgo con esporófitos (seta y cápsula) -->
  <symbol id="sil-bryophyte" viewBox="0 0 48 48">
    <g fill="currentColor">
      <path d="M4 44 C4 37 8 33 13 34 C14 29 20 27 24 30 C28 26 35 28 36 33 C41 32 45 37 44 44 Z"/>
      <rect x="15.2" y="15" width="1.6" height="18" rx=".8"/>
      <rect x="23.2" y="9" width="1.6" height="21" rx=".8"/>
      <rect x="31.2" y="13" width="1.6" height="18" rx=".8"/>
      <ellipse cx="17.5" cy="13" rx="2" ry="3.4" transform="rotate(20 17.5 13)"/>
      <ellipse cx="24" cy="7" rx="2" ry="3.4"/>
      <ellipse cx="30.5" cy="11" rx="2" ry="3.4" transform="rotate(-20 30.5 11)"/>
    </g>
  </symbol>

  <!-- hongo: seta de sombrero abombado, láminas insinuadas y pie con anillo -->
  <symbol id="sil-fungus" viewBox="0 0 48 48">
    <g fill="currentColor">
      <path d="M4 24 C4 12 13 5 24 5 C35 5 44 12 44 24 Z"/>
      <path d="M19 27 L29 27 L30 44 C30 45.5 28.5 46 24 46 C19.5 46 18 45.5 18 44 Z"/>
      <rect x="16.5" y="31" width="15" height="2.6" rx="1.3"/>
    </g>
    <path d="M10 24 L14 21 M18 24 L20 21 M30 24 L28 21 M38 24 L34 21" stroke="currentColor" stroke-width="1" opacity=".4"/>
  </symbol>

  <!-- liquen: tres copas de Cladonia (podecios en forma de trompeta) -->
  <symbol id="sil-lichen" viewBox="0 0 48 48">
    <g fill="currentColor">
      <path d="M8 16 L18 16 L14.4 24 L14.4 44 L11.6 44 L11.6 24 Z"/>
      <ellipse cx="13" cy="16" rx="5" ry="1.8"/>
      <path d="M18 8 L30 8 L25.6 17 L25.6 44 L22.4 44 L22.4 17 Z"/>
      <ellipse cx="24" cy="8" rx="6" ry="2"/>
      <path d="M30 20 L40 20 L36.4 27 L36.4 44 L33.6 44 L33.6 27 Z"/>
      <ellipse cx="35" cy="20" rx="5" ry="1.8"/>
      <path d="M4 46 C8 42 40 42 44 46 Z"/>
    </g>
  </symbol>

  <!-- alga: tres frondes ondulantes desde un disco basal -->
  <symbol id="sil-alga" viewBox="0 0 48 48">
    <g fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round">
      <path d="M24 44 C18 36 30 30 24 22 C18 14 28 10 25 4"/>
      <path d="M22 44 C14 40 18 32 12 27 C7 23 10 16 7 12"/>
      <path d="M26 44 C34 40 30 33 36 28 C41 24 38 18 41 13"/>
    </g>
    <ellipse cx="24" cy="44.5" rx="7" ry="2" fill="currentColor"/>
  </symbol>

  <!-- ave: pájaro posado de perfil -->
  <symbol id="sil-bird" viewBox="0 0 48 48">
    <g fill="currentColor">
      <ellipse cx="22" cy="27" rx="13" ry="8.5" transform="rotate(-18 22 27)"/>
      <circle cx="33" cy="16" r="6.5"/>
      <path d="M38.5 14 L46 16.5 L38.5 19 Z"/>
      <path d="M12 30 L2 39 L4.5 40.5 L15 33 Z"/>
      <rect x="20" y="34" width="2" height="9" rx="1"/>
      <rect x="26" y="33" width="2" height="10" rx="1"/>
      <rect x="16" y="42" width="16" height="2" rx="1"/>
    </g>
    <circle cx="34.5" cy="14.5" r="1.3" fill="currentColor" opacity=".35"/>
  </symbol>

  <!-- mamífero: cuadrúpedo de perfil (cabeza alta, orejas y cola) -->
  <symbol id="sil-mammal" viewBox="0 0 48 48">
    <g fill="currentColor">
      <ellipse cx="22" cy="25" rx="14" ry="7.5"/>
      <path d="M31 22 L35 11 L41 12 L38 24 Z"/>
      <ellipse cx="40" cy="12" rx="5.5" ry="4" transform="rotate(15 40 12)"/>
      <path d="M43.5 13 L47 15.5 L43 17 Z"/>
      <path d="M36.5 8.5 L37.5 3 L40 8 Z"/>
      <rect x="11" y="28" width="3.2" height="16" rx="1.5"/>
      <rect x="16.5" y="29" width="3.2" height="15" rx="1.5"/>
      <rect x="27" y="29" width="3.2" height="15" rx="1.5"/>
      <rect x="32" y="28" width="3.2" height="16" rx="1.5"/>
      <path d="M9 22 C4 21 2 25 3 30 L5 30 C5 27 6 25 9.5 25 Z"/>
    </g>
  </symbol>

  <!-- reptil: lagarto visto desde arriba, con cola larga -->
  <symbol id="sil-reptile" viewBox="0 0 48 48">
    <g fill="currentColor">
      <ellipse cx="24" cy="8" rx="3.6" ry="5"/>
      <ellipse cx="24" cy="21" rx="5" ry="9.5"/>
    </g>
    <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="M24 29 C24 36 28 40 34 42 C38 43 41 42 43 40" stroke-width="3.2"/>
      <path d="M20.5 15 L14 12.5 L12 8" stroke-width="2.4"/>
      <path d="M27.5 15 L34 12.5 L36 8" stroke-width="2.4"/>
      <path d="M20.5 26 L14 29 L12 33.5" stroke-width="2.4"/>
      <path d="M27.5 26 L34 29 L36 33.5" stroke-width="2.4"/>
    </g>
  </symbol>

  <!-- anfibio: rana vista desde arriba, ojos saltones y patas traseras plegadas -->
  <symbol id="sil-amphibian" viewBox="0 0 48 48">
    <g fill="currentColor">
      <ellipse cx="24" cy="25" rx="10" ry="12"/>
      <circle cx="18.5" cy="13.5" r="3.6"/>
      <circle cx="29.5" cy="13.5" r="3.6"/>
    </g>
    <g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M16 31 C9 32 7 37 11 41 L6 44"/>
      <path d="M32 31 C39 32 41 37 37 41 L42 44"/>
      <path d="M16 21 L9 20 L7 15"/>
      <path d="M32 21 L39 20 L41 15"/>
    </g>
  </symbol>

  <!-- pez: perfil fusiforme con aleta caudal ahorquillada -->
  <symbol id="sil-fish" viewBox="0 0 48 48">
    <g fill="currentColor">
      <path d="M4 24 C9 14 20 12 30 16 C33 17.5 35 19.5 36 21 L46 13 L43 24 L46 35 L36 27 C35 28.5 33 30.5 30 32 C20 36 9 34 4 24 Z"/>
      <path d="M17 15 L22 8 L27 14.5 Z"/>
      <path d="M20 33 L23 39 L26 33.2 Z"/>
    </g>
    <circle cx="11" cy="22.5" r="1.6" fill="currentColor" opacity=".35"/>
  </symbol>

  <!-- insecto: mariposa con antenas -->
  <symbol id="sil-insect" viewBox="0 0 48 48">
    <g fill="currentColor">
      <ellipse cx="14" cy="17" rx="10" ry="8" transform="rotate(-25 14 17)"/>
      <ellipse cx="34" cy="17" rx="10" ry="8" transform="rotate(25 34 17)"/>
      <ellipse cx="16.5" cy="32" rx="7" ry="5.5" transform="rotate(30 16.5 32)"/>
      <ellipse cx="31.5" cy="32" rx="7" ry="5.5" transform="rotate(-30 31.5 32)"/>
      <rect x="22.4" y="12" width="3.2" height="26" rx="1.6"/>
    </g>
    <path d="M23 12 C21 7 18 5 15.5 4.5 M25 12 C27 7 30 5 32.5 4.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
  </symbol>

  <!-- arácnido: araña con ocho patas acodadas -->
  <symbol id="sil-arachnid" viewBox="0 0 48 48">
    <g fill="currentColor">
      <circle cx="24" cy="18" r="5"/>
      <ellipse cx="24" cy="31" rx="7.5" ry="9"/>
    </g>
    <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 15 L12 9 L8 13"/>
      <path d="M19.5 18 L10 16 L4 22"/>
      <path d="M20 21 L11 24 L6 32"/>
      <path d="M21 23 L14 31 L12 40"/>
      <path d="M28 15 L36 9 L40 13"/>
      <path d="M28.5 18 L38 16 L44 22"/>
      <path d="M28 21 L37 24 L42 32"/>
      <path d="M27 23 L34 31 L36 40"/>
    </g>
  </symbol>

  <!-- molusco: caracol con concha en espiral y tentáculos -->
  <symbol id="sil-mollusc" viewBox="0 0 48 48">
    <path d="M22 23 a2 2 0 0 1 4 0 a4 4 0 0 1 -8 0 a6 6 0 0 1 12 0 a8 8 0 0 1 -16 0 a10 10 0 0 1 20 0" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/>
    <g fill="currentColor">
      <path d="M4 38 C4 35 7 34 12 34 L36 34 C38 30 38 26 39 24 C41 22 44 23 44 26 L44 37 C44 39 42 40 40 40 L7 40 C5 40 4 39.5 4 38 Z"/>
    </g>
    <path d="M40.5 24.5 L39 16 M42.5 24.5 L45 17" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="39" cy="15.5" r="1.4" fill="currentColor"/>
    <circle cx="45" cy="16.5" r="1.4" fill="currentColor"/>
  </symbol>

  <!-- crustáceo: cangrejo con pinzas -->
  <symbol id="sil-crustacean" viewBox="0 0 48 48">
    <g fill="currentColor">
      <ellipse cx="24" cy="28" rx="12" ry="8"/>
      <path d="M4 12 C4 7 9 5 12 8 L9 12 L13 13 C12 17 7 18 5 16 Z"/>
      <path d="M44 12 C44 7 39 5 36 8 L39 12 L35 13 C36 17 41 18 43 16 Z"/>
      <circle cx="20" cy="18" r="1.8"/>
      <circle cx="28" cy="18" r="1.8"/>
    </g>
    <g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M15 23 L10 17 L9 14"/>
      <path d="M33 23 L38 17 L39 14"/>
      <path d="M20 20 L20 23 M28 20 L28 23"/>
      <path d="M13 29 L6 31 L4 36"/>
      <path d="M14 32 L8 36 L7 41"/>
      <path d="M35 29 L42 31 L44 36"/>
      <path d="M34 32 L40 36 L41 41"/>
    </g>
  </symbol>

  <!-- otro invertebrado: estrella de mar de brazos redondeados -->
  <symbol id="sil-invertebrate" viewBox="0 0 48 48">
    <path d="M24 5 L28.5 18 L42 18.5 L31.5 27 L35.5 40.5 L24 32.5 L12.5 40.5 L16.5 27 L6 18.5 L19.5 18 Z"
          fill="currentColor" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/>
    <g fill="currentColor" opacity=".35">
      <circle cx="24" cy="14" r="1.2"/><circle cx="33" cy="21" r="1.2"/><circle cx="29.5" cy="31" r="1.2"/>
      <circle cx="18.5" cy="31" r="1.2"/><circle cx="15" cy="21" r="1.2"/>
    </g>
  </symbol>

  <!-- genérica: lupa sobre una hoja (organismo sin grupo conocido) -->
  <symbol id="sil-generic" viewBox="0 0 48 48">
    <path d="M8 34 C8 20 18 10 32 9 C33 22 24 33 8 34 Z" fill="currentColor" opacity=".45"/>
    <circle cx="22" cy="22" r="11" fill="none" stroke="currentColor" stroke-width="3.6"/>
    <path d="M30 30 L42 42" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
  </symbol>
</svg>
